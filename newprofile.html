<!DOCTYPE html>
<html>
<head>
<title>Mutant Records Collection</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>

body {
background: url('background.png') center center / cover no-repeat;
background-attachment: fixed;
color: #fff;
font-family: sans-serif;
margin: 0;
padding: 20px;
}


header {
background: url('background.png') center center / cover no-repeat;
height: 200px;
margin-bottom: 20px;
}


.badge-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 20px;
margin-top: 20px;
}


.badge-slot {
width: 100%;
aspect-ratio: 1 / 1;
border: 2px solid #fff;
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
background-color: #000;
color: #fff;
}


.badge-slot img {
max-width: 100%;
max-height: 100%;
}


#loadingIndicator {
display: none;
font-size: 18px;
color: #fff;
margin-top: 20px;
}


#progressBar {
width: 100%;
background-color: #333;
margin-top: 10px;
border: 1px solid #fff;
}


#progressBarFill {
height: 20px;
width: 0%;
background-color: #00ffff !important; /* cyberpunk blue */
transition: width 0.3s;
}


.badge-status {
margin: 6px 0;
font-weight: bold;
color: #fff;
}


.unlocked {
color: #0f0;
}


.locked {
color: #f00;
</html>
