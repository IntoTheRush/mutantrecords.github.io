<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mutant Records Collection</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body {
      background: url('background.png') center center / cover no-repeat;
      background-attachment: fixed;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    header {
      background: url('background.png') center center / cover no-repeat;
      height: 200px;
      margin-bottom: 20px;
    }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .badge-grid {
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      }
    }
    .badge-slot {
      width: 100%;
      padding-bottom: 100%; /* Fallback for aspect-ratio */
      position: relative;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background-color: #000;
      color: #fff;
      overflow: hidden;
    }
    .badge-slot img, .badge-slot video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #loadingIndicator {
      display: none;
      font-size: 18px;
      color: #fff;
      margin-top: 20px;
      text-align: center;
    }
    #progressBar {
      width: 100%;
      background-color: #333;
      margin-top: 10px;
      border: 1px solid #fff;
    }
    #progressBarFill {
      height: 20px;
      width: 0%;
      background-color: #00ffff;
      transition: width 0.3s;
    }
    .badge-status {
      margin: 6px 0;
      font-weight: bold;
      color: #fff;
    }
    .unlocked { color: #0f0; }
    .locked { color: #f00; }
    .error { color: #ff5555; }
    button, #exitButton {
      background-color: #222;
      color: #fff;
      border: 1px solid #fff;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin: 10px 0;
      transition: background-color 0.2s;
    }
    button:hover, #exitButton:hover {
      background-color: #444;
    }
    #errorMessage {
      display: none;
      color: #ff5555;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <a href="index.html" id="exitButton">Exit</a>
  <div id="loginSection">
    <h1>Connect Wallet</h1>
    <button id="loginButton">Login with MetaMask</button>
    <div id="errorMessage"></div>
  </div>
  <div id="profileSection" style="display:none;">
    <h2>Mutant Records Collection</h2>
    <p id="walletAddress"></p>
    <button onclick="logout()">Logout</button>
    <div id="badgeOneStatus" class="badge-status"></div>
    <div id="badgeTwoStatus" class="badge-status"></div>
    <div id="badgeThreeStatus" class="badge-status"></div>
    <div id="badgeFourStatus" class="badge-status"></div>
    <div id="loadingIndicator">Loading your records...</div>
    <div id="progressBar">
      <div id="progressBarFill"></div>
    </div>
    <h3>Your Records</h3>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>

  <script>
    const CONTRACTS = {
      A: "0xed10cd2183de930c70c812d237d5ee763a9bbc52",
      B: "0xdfa50db2aa335e8ccd0671ca11abce7938a3ec09",
      OG: "0xbbe59d056e8a1ce9acc0b83574075f41d0aeca07"
    };

    const CONTRACT_ABI_721 = [
      { inputs: [{ name: "tokenId", type: "uint256" }], name: "ownerOf", outputs: [{ name: "owner", type: "address" }], stateMutability: "view", type: "function" },
      { inputs: [{ name: "tokenId", type: "uint256" }], name: "tokenURI", outputs: [{ name: "uri", type: "string" }], stateMutability: "view", type: "function" },
      { inputs: [], name: "totalSupply", outputs: [{ name: "", type: "uint256" }], stateMutability: "view", type: "function" }
    ];

    const CONTRACT_ABI_1155 = [
      { inputs: [{ name: "account", type: "address" }, { name: "id", type: "uint256" }], name: "balanceOf", outputs: [{ name: "", type: "uint256" }], stateMutability: "view", type: "function" }
    ];

    const APECHAIN_PARAMS = {
      chainId: "33139", // 33139 in hex
      chainName: "ApeChain",
      nativeCurrency: { name: "APE", symbol: "APE", decimals: 18 },
      rpcUrls: ["https://apechain.drpc.org"],
      blockExplorerUrls: ["https://apescan.io"]
    };

    const state = {
      provider: null,
      signer: null,
      userAddress: null,
      badge1: false,
      badge2: false,
      badge3: false,
      badge4: false,
      badgeURIs: [],
      seenNames: new Set()
    };

    // Utility Functions
    const resolveIPFS = (uri) => uri.startsWith("ipfs://") ? `https://ipfs.io/ipfs/${uri.slice(7)}` : uri;

    const showError = (message) => {
      const errorDiv = document.getElementById("errorMessage");
      errorDiv.innerText = message;
      errorDiv.style.display = "block";
    };

    const clearError = () => {
      const errorDiv = document.getElementById("errorMessage");
      errorDiv.innerText = "";
      errorDiv.style.display = "none";
    };

    const updateProgress = (processed, total) => {
      const percent = Math.min(Math.round((processed / total) * 100), 100);
      document.getElementById("progressBarFill").style.width = `${percent}%`;
    };

    const sanitizeString = (str) => {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    };

    // Blockchain Interaction
    async function switchToApeChain(provider) {
      try {
        await provider.send("wallet_switchEthereumChain", [{ chainId: APECHAIN_PARAMS.chainId }]);
      } catch (err) {
        if (err.code === 4902) {
          await provider.send("wallet_addEthereumChain", [APECHAIN_PARAMS]);
        } else {
          throw new Error("Failed to switch to ApeChain");
        }
      }
    }

    async function getTotalSupply(contract) {
      try {
        const supply = await contract.totalSupply();
        return ethers.BigNumber.from(supply).toNumber();
      } catch {
        return 0; // Fallback if totalSupply not available
      }
    }

    async function scanContract(contract, tokenIds, contractLabel, userAddress) {
      let processed = 0;
      const total = tokenIds.length;

      const batchSize = 50; // Process in batches to avoid rate limits
      for (let i = 0; i < tokenIds.length; i += batchSize) {
        const batch = tokenIds.slice(i, i + batchSize);
        await Promise.all(batch.map(async (tokenId) => {
          try {
            const owner = await contract.ownerOf(tokenId);
            if (owner.toLowerCase() === userAddress.toLowerCase()) {
              const uriRaw = await contract.tokenURI(tokenId);
              const uri = resolveIPFS(uriRaw);
              const response = await fetchWithRetry(uri);
              if (!response.ok) return;
              const metadata = await response.json();
              const name = sanitizeString(metadata.name || `Token ${tokenId}`);
              if (state.seenNames.has(name)) return;
              state.seenNames.add(name);
              const image = resolveIPFS(metadata.image || "");
              state.badgeURIs.push({ src: image, name });

              if (name === "NaNa The Ape, Rick Starr - $HOES Anthem") state.badge3 = true;
              if (name === "NaNe The Ape & Rick Starr - Let's Ape") state.badge2 = true;
              if (!state.badge1 && contractLabel === "A") state.badge1 = true;
            }
          } catch (err) {
            console.warn(`Error on token ${tokenId} of contract ${contractLabel}:`, err);
          } finally {
            processed++;
            updateProgress(processed, total);
          }
        }));
      }
    }

    async function fetchWithRetry(url, retries = 3, delay = 1000) {
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url);
          if (response.ok) return response;
          throw new Error(`HTTP ${response.status}`);
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
    }

    async function checkOGBadge(userAddress, contractOGInstance) {
      try {
        for (let tokenId = 0; tokenId < 100; tokenId++) {
she
          const balance = await contractOGInstance.balanceOf(userAddress, tokenId);
          if (balance.gt(0)) {
            state.badge4 = true;
            return true;
          }
        }
        return false;
      } catch (err) {
        console.warn("Error checking OG badge:", err);
        return false;
      }
    }

    // Main Logic
    async function connectWallet() {
      if (!window.ethereum) {
        showError("Please install MetaMask or another wallet provider!");
        return;
      }

      try {
        clearError();
        document.getElementById("loadingIndicator").style.display = "block";
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        state.provider = provider;

        await provider.send("eth_requestAccounts", []);
        await switchToApeChain(provider);
        state.signer = provider.getSigner();
        state.userAddress = await state.signer.getAddress();

        document.getElementById("walletAddress").innerText = `Wallet: ${state.userAddress}`;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("profileSection").style.display = "block";

        const contractAInstance = new ethers.Contract(CONTRACTS.A, CONTRACT_ABI_721, provider);
        const contractBInstance = new ethers.Contract(CONTRACTS.B, CONTRACT_ABI_721, provider);
        const contractOGInstance = new ethers.Contract(CONTRACTS.OG, CONTRACT_ABI_1155, provider);

        // Dynamically fetch total supply
        const totalSupplyA = await getTotalSupply(contractAInstance) || 69;
        const totalSupplyB1 = await getTotalSupply(contractBInstance) || 420;
        const totalSupplyB2 = await getTotalSupply(contractBInstance) || 4000;

        await scanContract(contractAInstance, Array.from({ length: totalSupplyA }, (_, i) => i + 1), "A", state.userAddress);
        await scanContract(contractBInstance, [...Array.from({ length: totalSupplyB1 }, (_, i) => i + 1), ...Array.from({ length: totalSupplyB2 - 2800 + 1 }, (_, i) => i + 2800)], "B", state.userAddress);

        const isOGHolder = await checkOGBadge(state.userAddress, contractOGInstance);

        // Update badge statuses
        document.getElementById("badgeOneStatus").innerHTML = state.badge1
          ? "✅ <span class='unlocked'>Royalty Music Pass Unlocked</span>"
          : "🔒 <span class='locked'>Badge 1 Locked</span>";
        document.getElementById("badgeTwoStatus").innerHTML = state.badge2
          ? "✅ <span class='unlocked'>Badge 2 Unlocked (\"Let's Ape\")</span>"
          : "🔒 <span class='locked'>Badge 2 Locked</span>";
        document.getElementById("badgeThreeStatus").innerHTML = state.badge3
          ? "✅ <span class='unlocked'>Badge 3 Unlocked (\"$HOES Anthem\")</span>"
          : "🔒 <span class='locked'>Badge 3 Locked</span>";
        document.getElementById("badgeFourStatus").innerHTML = isOGHolder
          ? "✅ <span class='unlocked'>OG Supporter</span>"
          : "🔒 <span class='locked'>Badge 4 Locked</span>";

        // Render badge grid
        const badgeGrid = document.getElementById("badgeGrid");
        badgeGrid.innerHTML = "";
        const maxSlots = Math.max(10, state.badgeURIs.length);

        for (let i = 0; i < maxSlots; i++) {
          const slot = document.createElement("div");
          slot.className = "badge-slot";
          if (i === 0 && state.badge1) {
            const video = document.createElement("video");
            video.src = "royaltypass.MP4";
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.playsInline = true;
            slot.appendChild(video);
          } else if (i === 3 && isOGHolder) {
            const img = document.createElement("img");
            img.src = "apestrong.jpg";
            img.alt = "OG Holder Badge";
            slot.appendChild(img);
          } else if (i < state.badgeURIs.length) {
            const img = document.createElement("img");
            img.src = state.badgeURIs[i].src;
            img.alt = state.badgeURIs[i].name;
            img.title = state.badgeURIs[i].name;
            img.onerror = () => { img.src = "fallback.png"; }; // Fallback image
            slot.appendChild(img);
          } else {
            slot.innerText = "Empty Record Slot";
          }
          badgeGrid.appendChild(slot);
        }

        document.getElementById("loadingIndicator").style.display = "none";
      } catch (err) {
        showError(`Error connecting wallet: ${err.message}`);
        console.error("Connect wallet error:", err);
        document.getElementById("loadingIndicator").style.display = "none";
      }
    }

    function logout() {
      state.userAddress = null;
      state.badgeURIs = [];
      state.seenNames.clear();
      document.getElementById("loadingIndicator").style.display = "none";
      document.getElementById("progressBarFill").style.width = "0%";
      location.reload();
    }

    document.getElementById("loginButton").onclick = connectWallet;
  </script>
</body>
</html>
